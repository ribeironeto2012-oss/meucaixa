<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#820ad1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Caixa">
<title>Meu Caixa</title>
<link rel="manifest" id="manifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23820ad1'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3ER$%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f2f8;--card:#fff;--text:#1d1530;--muted:#6f6a80;--line:#ece8f3;
  --brand:#820ad1;--brand2:#a64df0;--green:#0f9d58;--green-bg:#e3f6ec;--red:#e5484d;--red-bg:#fdeaea;
  --amber:#b7791f;--amber-bg:#fdf3dc;--shadow:0 4px 18px rgba(60,20,100,.08);--chip:#f1edf7;
}
[data-theme=dark]{
  --bg:#110d1a;--card:#1c1629;--text:#f1ecfa;--muted:#9d94b3;--line:#2b2340;
  --green:#3ddc84;--green-bg:#12301f;--red:#ff6b70;--red-bg:#3a1a1d;--amber:#f5c26b;--amber-bg:#3a2d14;
  --shadow:0 4px 18px rgba(0,0,0,.4);--chip:#2a2140;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--text)}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 8px}
.brand{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:18px;color:var(--brand)}
[data-theme=dark] .brand{color:var(--brand2)}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-top:10px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:6px}
.monthbar .arrow{width:42px;height:38px;border-radius:12px;font-size:20px;font-weight:700;color:var(--brand)}
.monthbar .arrow:active{background:var(--chip)}
.monthbar .label{font-weight:700;font-size:16px;flex:1;text-align:center}
main{padding:8px 16px calc(110px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#820ad1,#b44cf5);color:#fff;border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:0 8px 24px rgba(130,10,209,.35)}
.hero small{opacity:.85;font-weight:600}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:4px 0}
.hero .sub{font-size:13px;opacity:.85}
.neg{color:#ffd0d3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid2 .card{margin:0}
.stat small{color:var(--muted);font-weight:600;display:block;font-size:12px}
.stat .v{font-size:20px;font-weight:800;margin-top:4px}
.stat .dot{display:inline-block;width:26px;height:26px;border-radius:9px;text-align:center;line-height:26px;margin-bottom:6px;font-size:14px}
.green{color:var(--green)}.red{color:var(--red)}.muted{color:var(--muted)}
.progress{height:10px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:10px}
.progress>i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .5s}
.progress>i.warn{background:#f59e0b}.progress>i.bad{background:var(--red)}
h2{font-size:16px;margin:0 0 12px;font-weight:800}
h3{font-size:13px;margin:18px 4px 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.grow{flex:1;min-width:0}
.t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12px;color:var(--muted);margin-top:2px}
.amt{font-weight:800;white-space:nowrap}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:4px;vertical-align:middle}
.b-pix{background:#e0f2fe;color:#0369a1}.b-cash{background:var(--green-bg);color:var(--green)}.b-credit{background:#f3e3fd;color:#8a1fc9}
[data-theme=dark] .b-pix{background:#0c2b3f;color:#7cc8f5}[data-theme=dark] .b-credit{background:#32154a;color:#d49cf5}
.donutwrap{display:flex;align-items:center;gap:14px}
.legend{flex:1;min-width:0}
.legend .li{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar{height:6px;border-radius:9px;background:var(--chip);margin:2px 0 8px;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:9px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty b{display:block;font-size:34px;margin-bottom:6px}
/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -6px 20px rgba(60,20,100,.07)}
nav .tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:12px}
nav .tab .e{font-size:21px;filter:grayscale(1);opacity:.7}
nav .tab.on{color:var(--brand)}
[data-theme=dark] nav .tab.on{color:var(--brand2)}
nav .tab.on .e{filter:none;opacity:1}
.fab{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#820ad1,#b44cf5);color:#fff;font-size:34px;font-weight:300;line-height:1;margin:-30px auto 0;box-shadow:0 8px 22px rgba(130,10,209,.5);display:grid;place-items:center;transition:transform .15s;border:4px solid var(--bg)}
.fab:active{transform:scale(.92)}
.fab.pulse{animation:pulse .6s}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.22) rotate(90deg)}100%{transform:scale(1)}}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(15,5,30,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:28px 28px 0 0;max-height:94vh;overflow-y:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet.center{border-radius:24px;margin:auto 16px;max-height:80vh}
.overlay.mid{align-items:center}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--chip);padding:5px;border-radius:18px}
.seg button{padding:13px 0;border-radius:14px;font-weight:800;font-size:15px;color:var(--muted)}
.seg button.out.on{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(229,72,77,.4)}
.seg button.in.on{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(15,157,88,.4)}
[data-theme=dark] .seg button.in.on{color:#06210f}
.amountbox{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:18px 0 6px}
.amountbox span{font-size:24px;font-weight:700;color:var(--muted)}
.amountbox input{font-size:46px;font-weight:800;width:62%;border:0;background:none;outline:none;text-align:center;letter-spacing:-1px}
.amountbox input::placeholder{color:var(--line)}
.field{margin-top:14px}
.field>label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 2px 6px;text-transform:uppercase;letter-spacing:.4px}
.txt{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);outline:none;font-size:16px}
.txt:focus{border-color:var(--brand)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{padding:7px 12px;border-radius:99px;background:var(--chip);font-size:13px;font-weight:600}
.chip.on{background:var(--brand);color:#fff}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll .chip{flex:none}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;background:var(--chip);font-size:11.5px;font-weight:600;text-align:center;border:2px solid transparent;line-height:1.15}
.cat .e{font-size:24px}
.cat.on{border-color:var(--brand);background:var(--card);box-shadow:0 0 0 3px rgba(130,10,209,.15)}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay{padding:12px 4px;border-radius:14px;background:var(--chip);font-weight:700;font-size:13px;text-align:center;border:2px solid transparent}
.pay.on{border-color:var(--brand);background:var(--card)}
.pays.two{grid-template-columns:1fr 1fr}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.btn{width:100%;padding:16px;border-radius:16px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,#820ad1,#b44cf5);margin-top:18px}
.btn.out{background:var(--red)}.btn.in{background:var(--green)}
[data-theme=dark] .btn.in{color:#06210f}
.btn.sec{background:var(--chip);color:var(--text);margin-top:10px}
.btn.danger{background:var(--red-bg);color:var(--red);margin-top:10px}
.btn.sm{width:auto;padding:10px 16px;font-size:14px;margin:0;border-radius:12px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* extrato */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;padding:13px 14px 13px 40px;border-radius:16px;border:0;background:var(--card);box-shadow:var(--shadow);outline:none;font-size:15px}
.search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-style:normal;opacity:.6}
.dayhead{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);margin:16px 6px 6px}
.list{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:active{background:var(--chip)}
.item.flash{animation:flash 1.4s}
@keyframes flash{0%,60%{background:rgba(130,10,209,.18)}100%{background:transparent}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#1d1530;color:#fff;padding:12px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:.3s;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline3{display:grid;grid-template-columns:1.6fr 1fr .7fr;gap:8px}
.status{padding:7px 12px;border-radius:99px;font-size:12.5px;font-weight:800}
.s-paid{background:var(--green-bg);color:var(--green)}
.s-pend{background:var(--amber-bg);color:var(--amber)}
.s-late{background:var(--red-bg);color:var(--red)}
.x{width:30px;height:30px;border-radius:10px;color:var(--muted);font-size:15px}
.x:active{background:var(--chip)}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:700}
.setbtn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);text-align:left;font-weight:600}
.setbtn:last-child{border-bottom:0}
.setbtn .e{font-size:20px;width:30px;text-align:center}
.setbtn small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.mini{font-size:12px}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:15px;font-weight:800;margin-top:2px;color:transparent}
.chk.on{background:var(--brand);border-color:var(--brand);color:#fff}
.impsel{padding:7px 8px;margin-top:6px;font-size:13px;border-radius:10px}
.hidden{display:none}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="screen"></main>
  <nav id="nav"></nav>
</div>
<div id="sheet-root"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept=".json,application/json" class="hidden">
<input type="file" id="bankfile" accept=".csv,.txt,.ofx,.xlsx,.xls,.pdf,text/csv" class="hidden">

<script>
(function(){
'use strict';
/* ========== Utilidades ========== */
const $=s=>document.querySelector(s);
const fmt=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl=n=>fmt.format(Math.round((n+Number.EPSILON)*100)/100).replace(/\u00a0/g,' ');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const ym=s=>s.slice(0,7);
const addM=(s,n)=>{const d=parse(s),day=d.getDate();const t=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return ymd(t)};
const addYM=(k,n)=>{const a=k.split('-').map(Number);const t=new Date(a[0],a[1]-1+n,1);return t.getFullYear()+'-'+pad(t.getMonth()+1)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayStr=()=>ymd(new Date());
const yesterdayStr=()=>{const d=new Date();d.setDate(d.getDate()-1);return ymd(d)};
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((s,t)=>s+t.amount,0);
const fmtDM=s=>{const d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const monthLabel=k=>{const a=k.split('-');return MESES[+a[1]-1]+' '+a[0]};
function parseAmt(s){
  s=String(s||'').trim().replace(/[^\d.,]/g,'');
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=parseFloat(s);return isNaN(n)?0:Math.round(n*100)/100;
}

/* ========== Categorias ========== */
const CATS={
  small:{l:'Gastos Desnecessários',i:'💸',c:'#f59e0b',t:'out'},
  fuel:{l:'Combustível',i:'⛽',c:'#ef4444',t:'out'},
  food:{l:'Alimentação / Delivery',i:'🍔',c:'#f97316',t:'out'},
  home:{l:'Contas de Casa',i:'🏠',c:'#3b82f6',t:'out'},
  stock:{l:'Estoque / Custos Loja',i:'👕',c:'#8b5cf6',t:'out'},
  fun:{l:'Lazer / Outros',i:'🎉',c:'#ec4899',t:'out'},
  fatura:{l:'Fatura do Cartão',i:'💳',c:'#6b7280',t:'out'},
  sales:{l:'Venda de Roupas',i:'👗',c:'#10b981',t:'in'},
  salary:{l:'Salário / Renda Fixa',i:'💼',c:'#059669',t:'in'},
  extra:{l:'Entregas / Renda Extra',i:'🛵',c:'#14b8a6',t:'in'},
  other:{l:'Outros',i:'➕',c:'#64748b',t:'in'}
};
const CAT_OUT=['small','fuel','food','home','stock','fun'];
const CAT_IN=['sales','salary','extra','other'];
const PAY={pix:'Pix/Débito',cash:'Dinheiro',credit:'Crédito'};
const DEFAULT_CHIPS={
  out:[['Lanche rápido','small'],['Café','small'],['Conveniência','small'],['Compra por impulso','small'],['Gasolina/Etanol','fuel'],['Almoço','food'],['Delivery','food'],['Mercado','food']],
  in:[['Venda de Roupa','sales'],['Salário','salary'],['Entrega','extra'],['Pix recebido','other']]
};

/* ========== Estado e persistência ========== */
const KEY='meu_caixa_v1';
const blank=()=>({settings:{limit:3000,closing:10,due:17,theme:'auto',goalSmall:0,goalFuel:0,lastBackupTs:0},tx:[],bills:{},rec:[],recPaid:{},rules:[]});
let S=load();
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);const b=blank();return{settings:Object.assign(b.settings,o.settings||{}),tx:o.tx||[],bills:o.bills||{},rec:o.rec||[],recPaid:o.recPaid||{},rules:Array.isArray(o.rules)?o.rules:[]}}}catch(e){}
  return blank();
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ Não foi possível salvar no navegador')}}

const now=new Date();
const UI={tab:'home',key:now.getFullYear()+'-'+pad(now.getMonth()+1),filter:'all',q:'',flash:null};
let F=null; // formulário do lançamento

/* ========== Regras de negócio ========== */
const billMonthFor=ds=>{const d=parse(ds);return d.getDate()>(+S.settings.closing||31)?addYM(ym(ds),1):ym(ds)};

function addTransaction(f,keepTs){
  const out=[];const ts=keepTs||Date.now();
  if(f.type==='out'&&f.pay==='credit'){
    const n=Math.max(1,f.inst|0),cents=Math.round(f.amount*100),base=Math.floor(cents/n),rem=cents-base*n;
    const gid=n>1?uid():null,first=billMonthFor(f.date);
    for(let i=0;i<n;i++){
      out.push({id:uid(),ts:ts+i,type:'out',amount:(base+(i===n-1?rem:0))/100,desc:f.desc,cat:f.cat,pay:'credit',
        date:addM(f.date,i),billMonth:addYM(first,i),groupId:gid,instNo:i+1,instTotal:n});
    }
  }else{
    out.push({id:uid(),ts:ts,type:f.type,amount:f.amount,desc:f.desc,cat:f.cat,pay:f.pay,date:f.date});
  }
  S.tx.push.apply(S.tx,out);
  return out;
}
function deleteTx(id,all){
  const t=S.tx.find(x=>x.id===id);if(!t)return;
  const victims=all&&t.groupId?S.tx.filter(x=>x.groupId===t.groupId):[t];
  victims.forEach(v=>{
    if(v.isBillPayment)delete S.bills[v.billMonth];
    if(v.recKey)delete S.recPaid[v.recKey];
  });
  const ids=new Set(victims.map(v=>v.id));
  S.tx=S.tx.filter(x=>!ids.has(x.id));
  persist();
}
function calc(M){
  const inM=S.tx.filter(t=>ym(t.date)===M);
  const entradas=sum(inM.filter(t=>t.type==='in'));
  const vista=sum(inM.filter(t=>t.type==='out'&&t.pay!=='credit'));
  const fatura=sum(S.tx.filter(t=>t.pay==='credit'&&t.billMonth===M));
  const acum=sum(S.tx.filter(t=>t.type==='in'&&ym(t.date)<=M))-sum(S.tx.filter(t=>t.type==='out'&&t.pay!=='credit'&&ym(t.date)<=M));
  const cats={};
  inM.filter(t=>t.type==='out'&&!t.isBillPayment&&t.cat!=='fatura').forEach(t=>{cats[t.cat]=(cats[t.cat]||0)+t.amount});
  const lojaVendas=sum(inM.filter(t=>t.type==='in'&&t.cat==='sales'));
  const lojaEstoque=sum(inM.filter(t=>t.type==='out'&&t.cat==='stock'));
  return{entradas,vista,saldo:entradas-vista,fatura,acum,cats,lojaVendas,lojaEstoque,loja:lojaVendas-lojaEstoque,totalOut:Object.values(cats).reduce((a,b)=>a+b,0)};
}
const committed=()=>sum(S.tx.filter(t=>t.pay==='credit'&&!S.bills[t.billMonth]));

/* ========== UI helpers ========== */
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2300)}
function buzz(){try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}
function applyTheme(){
  const t=S.settings.theme;let dark=t==='dark'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#1c1629':'#820ad1';
}
function dayLabel(ds){

/* ---------- Novos: backup, metas, regras, resumo pessoal ---------- */
function backupInfo(){
  const last=+S.settings.lastBackupTs||0;
  const fresh=S.tx.filter(t=>(t.ts||0)>last).length;
  if(!fresh)return null;
  const ref=last||Math.min.apply(null,S.tx.map(t=>t.ts||Date.now()));
  const ms=Date.now()-ref;
  if(ms<=10*864e5)return null;
  return{days:Math.floor(ms/864e5),fresh:fresh,never:!last};
}
function backupBanner(){
  const b=backupInfo();if(!b)return '';
  const txt=(b.never?'Você ainda não fez backup':'Último backup há '+b.days+' dias')+' · '+b.fresh+' lançamento'+(b.fresh>1?'s':'')+' novo'+(b.fresh>1?'s':'')+' sem backup';
  return '<div class="card row" style="padding:10px 12px;background:var(--amber-bg);box-shadow:none"><span style="font-size:20px">💾</span><div class="grow mini" style="color:var(--amber);font-weight:700">'+txt+'</div><button class="btn sm" data-a="expJson" style="font-size:13px;padding:9px 12px">Fazer backup agora</button></div>';
}
function lastBackupTxt(){
  const t=+S.settings.lastBackupTs||0;
  return t?'Último backup: '+new Date(t).toLocaleDateString('pt-BR')+'.':'Nenhum backup feito ainda.';
}

  const root=$('#sheet-root');const isOut=F.type==='out';const cats=isOut?CAT_OUT:CAT_IN;

let IMP=null;
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const fail=m=>{const e=new Error(m);e.user=true;return e};
function decodeText(buf){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('windows-1252').decode(buf)}
}
function pickDelim(text){
  const sample=text.split(/\r\n|\n|\r/).filter(l=>l.trim()).slice(0,40).join('\n');
  const c=ch=>sample.split(ch).length-1;
  const sc=c(';'),tb=c('\t'),cm=c(',');
  if(sc>=tb&&sc>=cm&&sc>0)return ';';
  if(tb>=cm&&tb>0)return '\t';
  return ',';
}
function parseDelimited(text,d){
  text=text.replace(/^﻿/,'');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===d){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.map(r=>r.map(x=>x.trim()));
}
function validDate(y,mo,d){if(mo<1||mo>12||d<1||d>31)return null;return y+'-'+pad(mo)+'-'+pad(d)}
function parseDateCell(v){
  if(typeof v==='number'){
    if(v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+Math.floor(v)*86400000);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
    return null;
  }
  const s=String(v==null?'':v).trim();
  let m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;return validDate(y,+m[2],+m[1])}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m)return validDate(+m[1],+m[2],+m[3]);
  return null;
}
function parseMoney(v){
  if(typeof v==='number')return v;
  let s=String(v==null?'':v).trim();if(!s)return null;
  const neg=/^\(.*\)$/.test(s)||s.indexOf('-')>=0||/\sD$/i.test(s);
  s=s.replace(/[^\d.,]/g,'');
  if(!/\d/.test(s))return null;
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);if(isNaN(n))return null;
  return neg?-Math.abs(n):n;
}
function extractRows(rows){
  const out=[];
  const push=(date,desc,val)=>{
    if(!date||val==null||!isFinite(val)||val===0)return;
    desc=String(desc==null?'':desc).replace(/\s+/g,' ').trim();
    if(/^saldo/.test(norm(desc)))return;
    out.push({date:date,desc:desc||'Lançamento',amount:Math.round(Math.abs(val)*100)/100,type:val<0?'out':'in'});
  };
  let hi=-1,H=null;
  for(let i=0;i<Math.min(rows.length,40);i++){
    const n=rows[i].map(norm);
    if(n.some(x=>x.indexOf('data')===0)&&n.some(x=>/valor|credito|debito/.test(x))){hi=i;H=n;break}
  }
  if(H){
    const iD=H.findIndex(x=>x.indexOf('data')===0);
    let iDesc=H.findIndex(x=>/descri|histor|lancamento|estabelec|detalhe/.test(x));
    if(iDesc<0)iDesc=iD+1;
    const iV=H.findIndex(x=>/^valor/.test(x));
    const iC=H.findIndex(x=>/^credito/.test(x));
    const iDb=H.findIndex(x=>/^debito/.test(x));
    for(let i=hi+1;i<rows.length;i++){
      const r=rows[i];const date=parseDateCell(r[iD]);if(!date)continue;
      let val=null;
      if(iV>=0)val=parseMoney(r[iV]);
      else{const c=iC>=0?parseMoney(r[iC]):null,d=iDb>=0?parseMoney(r[iDb]):null;if(c||d)val=(c?Math.abs(c):0)-(d?Math.abs(d):0)}
      push(date,r[iDesc],val);
    }
    return out;
  }
  // sem cabeçalho: adivinha pelas posições
  rows.forEach(r=>{
    const iD=r.findIndex(c=>parseDateCell(c));if(iD<0)return;
    const date=parseDateCell(r[iD]);
    let val=null,iv=-1;
    for(let j=iD+1;j<r.length;j++){const c=r[j];if(typeof c==='number'||/\d[.,]\d{2}\s*[DC]?$/i.test(String(c))){const m=parseMoney(c);if(m!=null){val=m;iv=j;break}}}
    let desc='';for(let j=iD+1;j<r.length;j++){if(j===iv)continue;const c=String(r[j]);if(c.length>desc.length&&parseMoney(c)==null||/[a-z]/i.test(c)&&c.length>desc.length)desc=c}
    push(date,desc,val);
  });
  return out;
}
function parseOFX(text){
  const out=[];const re=/<STMTTRN>([\s\S]*?)(?=<\/STMTTRN>|<STMTTRN>|<\/BANKTRANLIST>)/gi;let m;
  const tag=(b,t)=>{const x=b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i'));return x?x[1].trim():''};
  while((m=re.exec(text))){
    const b=m[1];const dt=tag(b,'DTPOSTED');
    const date=dt.length>=8?validDate(+dt.slice(0,4),+dt.slice(4,6),+dt.slice(6,8)):null;
    const amt=parseFloat(tag(b,'TRNAMT').replace(',','.'));
    if(date&&isFinite(amt)&&amt!==0)out.push({date:date,desc:(tag(b,'MEMO')||tag(b,'NAME')||'Lançamento').replace(/\s+/g,' '),amount:Math.round(Math.abs(amt)*100)/100,type:amt<0?'out':'in',fit:tag(b,'FITID')});
  }
  return out;
}
/* --- XLSX (zip + XML, sem bibliotecas) --- */
async function inflateRaw(u8){
  const ds=new DecompressionStream('deflate-raw');
  const w=ds.writable.getWriter();w.write(u8);w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
async function unzip(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf);
  let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw fail('Arquivo Excel inválido');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
  const files={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    files[new TextDecoder().decode(u8.subarray(p+46,p+46+nl))]={method:method,csz:csz,off:off};
    p+=46+nl+el+cl;
  }
  return{names:Object.keys(files),get:async name=>{
    const f=files[name];if(!f)return null;
    const o=f.off,ln=dv.getUint16(o+26,true),le=dv.getUint16(o+28,true),start=o+30+ln+le;
    const data=u8.subarray(start,start+f.csz);
    return new TextDecoder().decode(f.method===0?data:await inflateRaw(data));
  }};
}
const xmlDec=s=>s.replace(/&#x([0-9a-f]+);/gi,(_,h)=>String.fromCharCode(parseInt(h,16))).replace(/&#(\d+);/g,(_,d)=>String.fromCharCode(+d)).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
const colIdx=ref=>{const m=ref.match(/^[A-Z]+/);if(!m)return 0;let n=0;for(let i=0;i<m[0].length;i++)n=n*26+m[0].charCodeAt(i)-64;return n-1};
const texts=x=>{let o='',m;const re=/<t\b[^>]*>([\s\S]*?)<\/t>/g;x=x.replace(/<rPh\b[\s\S]*?<\/rPh>/g,'');while((m=re.exec(x)))o+=m[1];return xmlDec(o)};
async function parseXLSX(buf){
  const z=await unzip(buf);
  const ss=[];const sx=await z.get('xl/sharedStrings.xml');
  if(sx){let m;const re=/<si\b[^>]*?(?:\/>|>([\s\S]*?)<\/si>)/g;while((m=re.exec(sx)))ss.push(m[1]?texts(m[1]):'')}
  const sheets=z.names.filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
  if(!sheets.length)throw fail('Não achei a planilha dentro do arquivo');
  const xml=await z.get(sheets[0]);
  const rows=[];let rm;const rre=/<row\b[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g;
  while((rm=rre.exec(xml))){
    const arr=[];if(rm[1]){
      let cm;const cre=/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
      while((cm=cre.exec(rm[1]))){
        const at=cm[1],body=cm[2]||'';
        const ref=(at.match(/\br="([^"]+)"/)||[])[1]||'',t=(at.match(/\bt="([^"]+)"/)||[])[1];
        const vm=body.match(/<v>([\s\S]*?)<\/v>/);let v='';
        if(t==='s')v=vm?(ss[+vm[1]]||''):'';
        else if(t==='inlineStr')v=texts(body);
        else if(vm){v=xmlDec(vm[1]);if(t!=='str'&&t!=='e'&&v!==''&&!isNaN(v))v=Number(v)}
        arr[colIdx(ref)]=v;
      }
      for(let i=0;i<arr.length;i++)if(arr[i]===undefined)arr[i]='';
    }
    rows.push(arr);
  }
  return rows;
}
async function parseBankFile(buf){
  const u8=new Uint8Array(buf);
  const head=String.fromCharCode.apply(null,Array.from(u8.subarray(0,5)));
  if(head.indexOf('%PDF')===0)throw fail('PDF não dá para ler aqui. No Santander, exporte em Excel, CSV ou OFX.');
  if(u8[0]===0xD0&&u8[1]===0xCF)throw fail('Esse é um .xls antigo. Abra no Excel e salve como .xlsx ou CSV.');
  if(head.indexOf('PK')===0){
    let ok=false;try{ok=typeof DecompressionStream==='function'&&!!new DecompressionStream('deflate-raw')}catch(e){ok=false}
    if(!ok)throw fail('Seu navegador não suporta .xlsx direto. Exporte o extrato em CSV ou OFX no banco.');
    return extractRows(await parseXLSX(buf));
  }
  const text=decodeText(buf);
  if(/<OFX|<STMTTRN/i.test(text))return parseOFX(text);
  return extractRows(parseDelimited(text,pickDelim(text)));
}
function guessCat(x){
  const d=norm(x.desc);
  for(const r of (S.rules||[])){const k=norm(r.kw);if(k&&CATS[r.cat]&&CATS[r.cat].t===x.type&&d.indexOf(k)>=0)return r.cat}
  if(x.type==='in'){
    if(/salario|folha|proventos|pagto sal/.test(d))return 'salary';
    if(/pix|transf|ted|doc/.test(d))return 'sales';
    return 'other';
  }
  if(/fatura|pag\w*\s+(de\s+)?cart/.test(d))return 'fatura';
  if(/posto|combust|shell|ipiranga|petrobras|gasolina|etanol/.test(d))return 'fuel';
  if(/ifood|restaur|lanch|padaria|mercad|supermerc|pizza|acai|burger|acougue|hortifruti|atacad|sorvet|cafe|churrasc/.test(d))return 'food';
  if(/energia|cpfl|enel|cemig|sabesp|agua|internet|vivo|claro|fibra|\btim\b|aluguel|condominio|\bluz\b/.test(d))return 'home';
  if(x.amount<=15)return 'small';
  return 'fun';
}
async function importBank(file){
  try{
    const items=await parseBankFile(await file.arrayBuffer());
    if(!items.length){toast('Não encontrei lançamentos nesse arquivo');return}
    openImport(items,file.name);
  }catch(e){toast(e&&e.user?e.message:'Não consegui ler esse arquivo')}
}
function openImport(items,name){
  const ex=new Set(S.tx.map(t=>t.type+'|'+t.date+'|'+t.amount.toFixed(2)));
  const exFit=new Set(S.tx.filter(t=>t.fit).map(t=>t.fit));
  const rows=items.map(x=>{
    const dup=ex.has(x.type+'|'+x.date+'|'+x.amount.toFixed(2))||!!(x.fit&&exFit.has(x.fit));
    return{date:x.date,desc:x.desc,amount:x.amount,type:x.type,fit:x.fit||'',cat:guessCat(x),dup:dup,on:!dup};
  }).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  IMP={name:name,rows:rows};
  drawImport();
}

   '<div class="row between" style="margin-bottom:6px"><span class="mini muted">'+sel.length+' selecionado(s). Ajuste a categoria se precisar.</span><button class="chip" data-a="impAll">Marcar/desmarcar todos</button></div>'+
   '<div class="list">'+IMP.rows.map((r,i)=>{
      const cats=r.type==='in'?CAT_IN:optsOut;
      return '<div class="item" style="align-items:flex-start;cursor:default"><button class="chk '+(r.on?'on':'')+'" data-a="impTog" data-i="'+i+'" aria-label="Selecionar">✓</button>'+
        '<div class="grow"><div class="t1" style="white-space:normal">'+esc(r.desc)+'</div><div class="t2">'+fmtDM(r.date)+'/'+r.date.slice(0,4)+(r.dup?' · <b style="color:var(--amber)">possível duplicado</b>':'')+'</div>'+
        '<select class="txt impsel" data-k="impcat" data-id="'+i+'">'+cats.map(c=>'<option value="'+c+'"'+(r.cat===c?' selected':'')+'>'+CATS[c].i+' '+esc(CATS[c].l)+'</option>').join('')+'</select></div>'+
        '<div class="amt '+(r.type==='in'?'green':'')+'">'+(r.type==='in'?'+ ':'− ')+brl(r.amount)+'</div></div>';
    }).join('')+'</div>'+
   '<button class="btn" data-a="impDo">Importar '+sel.length+' lançamento'+(sel.length===1?'':'s')+'</button><button class="btn sec" data-a="impCancel">Cancelar</button></div></div>';
  const ns=$('#imp-sheet');if(ns)ns.scrollTop=st;
}
